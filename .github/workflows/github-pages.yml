name: Publish Documentation Site
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    env:
      SOLUTION_PATH: AppleTVControlLibrary.slnx
      TEST_PROJECT: tests/AppleTV.Companion.Tests/AppleTV.Companion.Tests.csproj
      MRP_TEST_PROJECT: tests/AppleTv.Mrp.Tests/AppleTv.Mrp.Tests.csproj
      DOCFX_CONFIG: src/AppleTV.Companion/docfx/docfx.json
      DOCFX_SITE: src/AppleTV.Companion/docfx/_site
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Build and verify standard documentation
      uses: oznetmaster/BuildAutomation@c0a215e202dc1e05a37707720ab12032be610518
      with:
        task: documentation
    - name: Configure Pages
      uses: actions/configure-pages@v5
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ env.DOCFX_SITE }}
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy_1.outputs.page_url || steps.deploy_2.outputs.page_url || steps.deploy_3.outputs.page_url }}
    runs-on: windows-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages (attempt 1)
      id: deploy_1
      uses: actions/deploy-pages@v4
      continue-on-error: true
    - name: Wait before retry 1
      if: steps.deploy_1.outcome == 'failure'
      shell: pwsh
      run: Start-Sleep -Seconds 20
    - name: Deploy to GitHub Pages (attempt 2)
      id: deploy_2
      if: steps.deploy_1.outcome == 'failure'
      uses: actions/deploy-pages@v4
      continue-on-error: true
    - name: Wait before retry 2
      if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
      shell: pwsh
      run: Start-Sleep -Seconds 20
    - name: Deploy to GitHub Pages (attempt 3)
      id: deploy_3
      if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
      uses: actions/deploy-pages@v4
'on':
  push:
    branches:
    - master
  workflow_dispatch: null
