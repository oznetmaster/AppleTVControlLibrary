name: Publish Documentation Site
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    env:
      SOLUTION_PATH: AppleTVControlLibrary.slnx
      TEST_PROJECT: tests/AppleTV.Companion.Tests/AppleTV.Companion.Tests.csproj
      MRP_TEST_PROJECT: tests/AppleTv.Mrp.Tests/AppleTv.Mrp.Tests.csproj
      DOCFX_CONFIG: src/AppleTV.Companion/docfx/docfx.json
      DOCFX_SITE: src/AppleTV.Companion/docfx/_site
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Build, verify and retain standard documentation
      uses: oznetmaster/BuildAutomation/.github/actions/documentation-build@c650afeb23c584d68580440ef0f7baaf737cdfd0
      with:
        site: ${{ env.DOCFX_SITE }}
        configure-pages: 'true'
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest
    needs: build
    steps:
    - name: Deploy documentation
      id: deployment
      uses: oznetmaster/BuildAutomation/.github/actions/documentation-deploy@c650afeb23c584d68580440ef0f7baaf737cdfd0
      with:
        attempts: '3'
'on':
  push:
    branches:
    - master
  workflow_dispatch: null
