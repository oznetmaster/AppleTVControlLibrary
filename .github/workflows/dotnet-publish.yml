name: Publish .NET Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version or tag to publish, for example 1.2.3 or v1.2.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      SOLUTION_PATH: AppleTVControlLibrary.slnx
      TEST_PROJECT: tests/AppleTV.Companion.Tests/AppleTV.Companion.Tests.csproj
      MRP_TEST_PROJECT: tests/AppleTv.Mrp.Tests/AppleTv.Mrp.Tests.csproj
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine package version
        id: version
        shell: pwsh
        run: |
          $rawVersion = switch ('${{ github.event_name }}') {
              'workflow_dispatch' { '${{ inputs.version }}'; break }
              'push' { '${{ github.ref_name }}'; break }
              default { '' }
          }

          if ([string]::IsNullOrWhiteSpace($rawVersion)) {
              throw 'No release tag or manual version was provided.'
          }

          $packageVersion = $rawVersion.Trim()
          if ($packageVersion.StartsWith('v', [System.StringComparison]::OrdinalIgnoreCase)) {
              $packageVersion = $packageVersion.Substring(1)
          }

          if ($packageVersion -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?(?:[-+][0-9A-Za-z\.-]+)?$') {
              throw "Version '$packageVersion' is not a supported NuGet semantic version."
          }

          "raw_version=$rawVersion" >> $env:GITHUB_OUTPUT
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Extract release notes from changelog
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.package_version }}'
          $lines = Get-Content CHANGELOG.md
          $headingPattern = "^## \[$([regex]::Escape($version))\](?:\s|$)"
          $start = -1

          for ($index = 0; $index -lt $lines.Count; $index++) {
              if ($lines[$index] -match $headingPattern) {
                  $start = $index
                  break
              }
          }

          if ($start -lt 0) {
              throw "No changelog section found for release version $version."
          }

          $end = $start + 1
          while ($end -lt $lines.Count -and $lines[$end] -notmatch '^## \[') {
              $end++
          }

          $releaseNotes = $lines[$start..($end - 1)] -join [Environment]::NewLine
          if ([string]::IsNullOrWhiteSpace($releaseNotes)) {
              throw "Changelog section for release version $version is empty."
          }

          New-Item -ItemType Directory -Path "${{ env.ARTIFACT_DIR }}" -Force | Out-Null
          $releaseNotesPath = "${{ env.ARTIFACT_DIR }}/release-notes.md"
          Set-Content -Path $releaseNotesPath -Value $releaseNotes -NoNewline

      - name: Restore solution
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Run tests (net472)
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release --no-build --framework net472

      - name: Run tests (net10.0)
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release --no-build --framework net10.0

      - name: Run Mrp tests (net472)
        run: dotnet test ${{ env.MRP_TEST_PROJECT }} --configuration Release --no-build --framework net472

      - name: Run Mrp tests (net10.0)
        run: dotnet test ${{ env.MRP_TEST_PROJECT }} --configuration Release --no-build --framework net10.0

      - name: Pack NuGet packages
        shell: pwsh
        run: |
          # All NuGet packages are kept in sync on the same version. The release tag's version is
          # forced onto every package here, overriding each project's own <Version>, so the
          # published set of packages always shares one version number.
          $packages = @(
              'src/AppleTV.Companion/AppleTV.Companion.csproj',
              'src/AppleTV.Companion.Discovery/AppleTV.Companion.Discovery.csproj',
              'src/AppleTV.Companion.All/AppleTV.Companion.All.csproj',
              'src/AppleTv.Mrp/AppleTv.Mrp.csproj'
          )
          $outputDir = "${{ env.ARTIFACT_DIR }}/nuget"
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          foreach ($project in $packages) {
              dotnet pack $project --configuration Release --no-build -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.version.outputs.package_version }} -p:ReleaseNotesFile="${{ env.ARTIFACT_DIR }}/release-notes.md" --output $outputDir
              if ($LASTEXITCODE -ne 0) {
                  throw "Pack failed for $project"
              }
          }

      - name: Publish NuGet packages
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path "${{ env.ARTIFACT_DIR }}/nuget" -Filter '*.nupkg' | Where-Object { $_.Name -notlike '*.symbols.nupkg' }
          if (-not $packages) {
              throw 'No NuGet packages were produced.'
          }

          foreach ($package in $packages) {
              dotnet nuget push $package.FullName --api-key "${{ secrets.NUGET_API_KEY }}" --source 'https://api.nuget.org/v3/index.json' --skip-duplicate
          }

      - name: Publish WPF reference application
        shell: pwsh
        run: |
          foreach ($framework in @('net472', 'net10.0-windows')) {
              $outputDir = "${{ env.ARTIFACT_DIR }}/publish/AppleTv.Remote.Wpf-$framework"
              dotnet publish src/AppleTv.Remote.Wpf/AppleTv.Remote.Wpf.csproj --configuration Release --no-build --framework $framework --output $outputDir -p:Version=${{ steps.version.outputs.package_version }}
              if ($LASTEXITCODE -ne 0) {
                  throw "Publish failed for AppleTv.Remote.Wpf ($framework)"
              }
          }

      - name: Publish MRP WPF reference application
        shell: pwsh
        run: |
          foreach ($framework in @('net472', 'net10.0-windows')) {
              $outputDir = "${{ env.ARTIFACT_DIR }}/publish/AppleTv.Remote.Mrp.Wpf-$framework"
              dotnet publish src/AppleTv.Remote.Mrp.Wpf/AppleTv.Remote.Mrp.Wpf.csproj --configuration Release --no-build --framework $framework --output $outputDir -p:Version=${{ steps.version.outputs.package_version }}
              if ($LASTEXITCODE -ne 0) {
                  throw "Publish failed for AppleTv.Remote.Mrp.Wpf ($framework)"
              }
          }

      - name: Collect release assets
        shell: pwsh
        run: |
          $releaseDir = "${{ env.ARTIFACT_DIR }}/release"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          $libraries = @(
              @{ ProjectDir = 'src/AppleTV.Companion'; AssemblyName = 'AppleTvControlLibrary'; Frameworks = @('net472', 'net10.0') },
              @{ ProjectDir = 'src/AppleTV.Companion.Discovery'; AssemblyName = 'AppleTvControlLibrary.Discovery'; Frameworks = @('net472', 'net10.0') },
              @{ ProjectDir = 'src/AppleTv.Mrp'; AssemblyName = 'AppleTvControlLibrary.Mrp'; Frameworks = @('net472', 'net10.0') }
          )

          foreach ($library in $libraries) {
              foreach ($framework in $library.Frameworks) {
                  $outputDir = Join-Path $library.ProjectDir "bin/Release/$framework"
                  foreach ($extension in @('dll', 'xml')) {
                      $sourcePath = Join-Path $outputDir "$($library.AssemblyName).$extension"
                      if (Test-Path $sourcePath) {
                          Copy-Item $sourcePath (Join-Path $releaseDir "$($library.AssemblyName).$framework.$extension") -Force
                      }
                  }
              }
          }

          Get-ChildItem -Path "${{ env.ARTIFACT_DIR }}/publish" -Directory | ForEach-Object {
              $zipPath = Join-Path $releaseDir "$($_.Name).zip"
              Compress-Archive -Path (Join-Path $_.FullName '*') -DestinationPath $zipPath -Force
          }

      - name: Create GitHub release from tag
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.raw_version }}
          name: ${{ steps.version.outputs.raw_version }}
          body_path: ${{ env.ARTIFACT_DIR }}/release-notes.md
          prerelease: ${{ contains(steps.version.outputs.package_version, '-') }}
          files: |
            ${{ env.ARTIFACT_DIR }}/release/*.dll
            ${{ env.ARTIFACT_DIR }}/release/*.xml
            ${{ env.ARTIFACT_DIR }}/release/*.zip
