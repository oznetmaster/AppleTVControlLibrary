name: Publish public library release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Three-part public version
        required: true
        type: string
      skip_desktop_checks:
        description: Reuse reviewed workstation validation
        type: boolean
        default: false
      desktop_skip_reason:
        description: Validated source, time, frameworks, counts and provenance
        type: string
      skip_hardware_checks:
        description: Reuse reviewed processor validation
        type: boolean
        default: false
      hardware_skip_reason:
        description: Validated source, time, selected tests, limitations and cleanup
        type: string
      validation_commit:
        description: Optional ancestor CI source permitted by the shared policy
        type: string
      retry_tagged_nuget:
        description: Retired rebuild retry; use Re-run failed jobs on the original run
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: public-release
  cancel-in-progress: false
  queue: max
jobs:
  build:

    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve public version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RETIRED_REBUILD_RETRY: ${{ inputs.retry_tagged_nuget }}
        run: |
          if ($env:RETIRED_REBUILD_RETRY -eq 'true') { throw 'Use Re-run failed jobs on the original release run to preserve its frozen artifacts.' }
          $version = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME } else { $env:REQUESTED_VERSION }
          $version = $version -creplace '^v', ''
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Use a canonical three-part stable public version.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: oznetmaster/BuildAutomation/.github/actions/release-prepare@5d8006f140a59c8d1dd92ab70723fe8338650bd2
        with:
          version: ${{ steps.version.outputs.version }}
      - name: Verify shared validation policy
        uses: oznetmaster/CrestronHomeNUnit/.github/actions/release-validation@2ae8197c6685099c2133e7bb962d1f3568aae9c3
        with:
          required-checks: ${{ vars.RELEASE_REQUIRED_CHECKS }}
          hosted-workflows: '["unit-tests.yml"]'
          skip-desktop-checks: ${{ inputs.skip_desktop_checks }}
          desktop-skip-reason: ${{ inputs.desktop_skip_reason }}
          skip-hardware-checks: ${{ inputs.skip_hardware_checks }}
          hardware-skip-reason: ${{ inputs.hardware_skip_reason }}
          validation-commit: ${{ inputs.validation_commit }}
      - name: Stage packages and companion applications through Cake
        uses: oznetmaster/BuildAutomation@5d8006f140a59c8d1dd92ab70723fe8338650bd2
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        with:
          task: release-assets
      - uses: oznetmaster/BuildAutomation/.github/actions/release-freeze@5d8006f140a59c8d1dd92ab70723fe8338650bd2
        with:
          version: ${{ steps.version.outputs.version }}
  publish:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30

    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: oznetmaster/BuildAutomation/.github/actions/release-publish@5d8006f140a59c8d1dd92ab70723fe8338650bd2
        with:
          version: ${{ needs.build.outputs.version }}
