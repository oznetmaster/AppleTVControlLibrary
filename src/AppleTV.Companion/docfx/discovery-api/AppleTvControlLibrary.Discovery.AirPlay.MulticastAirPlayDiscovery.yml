  assemblies:
  - AppleTvControlLibrary.Discovery
  namespace: AppleTvControlLibrary.Discovery.AirPlay
  summary: >-
    Discovers an AirPlay device by its mDNS service instance name and completes as soon

    as that service has been fully resolved.
  example: []
  syntax:
    content: public static Task<AirPlayDiscoveryResult?> DiscoveryAsync(string appleTvName, TimeSpan timeout, CancellationToken cancellationToken = default)
    parameters:
    - id: appleTvName
      type: System.String
      description: The exact mDNS service instance name to locate.
    - id: timeout
      type: System.TimeSpan
      description: The maximum time to wait for the named device.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: A token to cancel the lookup.
    return:
      type: System.Threading.Tasks.Task{AppleTvControlLibrary.Discovery.AirPlay.AirPlayDiscoveryResult}
      description: The matching device, or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> when it is not discovered before the timeout.
    content.vb: Public Shared Function DiscoveryAsync(appleTvName As String, timeout As TimeSpan, cancellationToken As CancellationToken = Nothing) As Task(Of AirPlayDiscoveryResult)
