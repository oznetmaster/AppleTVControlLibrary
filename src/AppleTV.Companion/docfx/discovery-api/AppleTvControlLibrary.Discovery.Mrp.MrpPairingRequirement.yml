  assemblies:
  - AppleTvControlLibrary.Discovery
  namespace: AppleTvControlLibrary.Discovery.Mrp
  summary: Whether pairing is required, supported, or disabled for a discovered MRP service.
  remarks: >-
    pyatv's <code>PairingRequirement</code> enum (pyatv/const.py — line 213-229 as of pyatv 0.18.0) has five

    values (Unsupported, Disabled, NotNeeded, Optional, Mandatory), but MRP's own

    <code>service_info</code> (pyatv/protocols/mrp/__init__.py — line 1085-1096 as of pyatv 0.18.0) only ever

    produces three of them, so only those three are modeled here rather than inventing meanings for

    the unused values.
  example: []
  syntax:
    content: public enum MrpPairingRequirement
    content.vb: Public Enum MrpPairingRequirement
