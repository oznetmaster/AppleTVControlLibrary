  assemblies:
  - AppleTvControlLibrary.Discovery
  namespace: AppleTvControlLibrary.Discovery.Mrp
  summary: >-
    Returns whether MRP is considered enabled for the given service's properties. pyatv disables

    MRP once the "SystemBuildVersion" leading numeric build component is 19 or higher (tvOS 15+).

    A missing or unparseable "SystemBuildVersion" is treated as enabled, matching pyatv's

    behavior when its regex match fails.
  example: []
  syntax:
    content: public static bool IsEnabled(IReadOnlyDictionary<string, string> properties)
    parameters:
    - id: properties
      type: System.Collections.Generic.IReadOnlyDictionary{System.String,System.String}
      description: The service's decoded TXT record properties.
    return:
      type: System.Boolean
      description: <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> if MRP should be considered enabled for this service.
    content.vb: Public Shared Function IsEnabled(properties As IReadOnlyDictionary(Of String, String)) As Boolean
