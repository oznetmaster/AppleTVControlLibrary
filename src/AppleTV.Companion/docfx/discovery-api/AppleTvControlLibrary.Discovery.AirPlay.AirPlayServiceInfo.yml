  assemblies:
  - AppleTvControlLibrary.Discovery
  namespace: AppleTvControlLibrary.Discovery.AirPlay
  summary: >-
    Removes a trailing mDNS instance-name disambiguation suffix (e.g. " (2)") from a service

    name, for display and storage purposes. The suffix is added by the network's mDNS

    responder when the same name is advertised by more than one device (e.g. an Apple TV and

    an unrelated AirPlay device both named "Office") and carries no protocol meaning.
  example: []
  syntax:
    content: public static string RemoveNameCollisionSuffix(string name)
    parameters:
    - id: name
      type: System.String
      description: The raw mDNS service instance name.
    return:
      type: System.String
      description: The name with any trailing " (n)" suffix removed.
    content.vb: Public Shared Function RemoveNameCollisionSuffix(name As String) As String
  overload: AppleTvControlLibrary.Discovery.AirPlay.AirPlayServiceInfo.RemoveNameCollisionSuffix*
