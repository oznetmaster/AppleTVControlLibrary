  assemblies:
  - AppleTvControlLibrary.Discovery
  namespace: AppleTvControlLibrary.Discovery.AirPlay
  summary: >-
    Determines whether a discovered AirPlay service's "model" TXT record identifies it as an

    Apple TV, as opposed to another AirPlay-capable device (e.g. a receiver or speaker).
  example: []
  syntax:
    content: public static bool IsAppleTv(IReadOnlyDictionary<string, string> properties)
    parameters:
    - id: properties
      type: System.Collections.Generic.IReadOnlyDictionary{System.String,System.String}
      description: The service's decoded TXT record properties.
    return:
      type: System.Boolean
      description: <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> if the "model" property matches the Apple TV identifier pattern.
    content.vb: Public Shared Function IsAppleTv(properties As IReadOnlyDictionary(Of String, String)) As Boolean
