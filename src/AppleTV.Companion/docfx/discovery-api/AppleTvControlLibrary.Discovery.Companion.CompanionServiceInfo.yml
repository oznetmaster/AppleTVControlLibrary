    startLine: 38
  assemblies:
  - AppleTvControlLibrary.Discovery
  namespace: AppleTvControlLibrary.Discovery.Companion
  summary: >-
    Returns the stable unique identifier for a Companion service, from the "rpmrtid"

    TXT record, or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> if not present.
  remarks: >-
    This identifies the Apple TV, not the client - it is unrelated to the client identity

    ("_i") that Companion pairing/session code generates and persists locally.

    Also note pyatv's own comment (helpers.py:74) only claims this is static on tvOS 16

    "(maybe earlier)"; there is no source statement covering tvOS 18+, so this is an

    observation carried from pyatv, not a documented guarantee.
  example: []
  syntax:
    content: public static string? GetUniqueId(IReadOnlyDictionary<string, string> properties)
    parameters:
    - id: properties
      type: System.Collections.Generic.IReadOnlyDictionary{System.String,System.String}
      description: The service's decoded TXT record properties.
    return:
      type: System.String
      description: The unique identifier, or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>.
    content.vb: Public Shared Function GetUniqueId(properties As IReadOnlyDictionary(Of String, String)) As String
