  assemblies:
  - AppleTvControlLibrary.Discovery
  namespace: AppleTvControlLibrary.Discovery.AirPlay
  summary: Whether pairing is required, supported, or disabled for a discovered AirPlay service.
  remarks: >-
    pyatv's <code>PairingRequirement</code> enum (pyatv/const.py — line 213-229 as of pyatv 0.18.0) has five

    values (Unsupported, Disabled, NotNeeded, Optional, Mandatory), but AirPlay's own

    <code>update_service_details</code>/<code>get_pairing_requirement</code>

    (pyatv/protocols/airplay/utils.py — line 139-157, 262-278 as of pyatv 0.18.0) only ever produces

    four of them, so only those four are modeled here rather than inventing meanings for the unused

    value.
  example: []
  syntax:
    content: public enum AirPlayPairingRequirement
    content.vb: Public Enum AirPlayPairingRequirement
