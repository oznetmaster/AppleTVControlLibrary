  - AppleTvControlLibrary.Discovery
  namespace: AppleTvControlLibrary.Discovery.Dns
  summary: >-
    Encodes a QNAME without using name compression. Labels are UTF-8 encoded, NFC

    normalized, truncated to 63 bytes without splitting multi-byte code points, and

    terminated with an empty root label.
  example: []
  syntax:
    content: public static byte[] QNameEncode(string name)
    parameters:
    - id: name
      type: System.String
      description: The dotted name, or a service instance name, to encode.
    return:
      type: System.Byte[]
      description: The encoded QNAME bytes.
    content.vb: Public Shared Function QNameEncode(name As String) As Byte()
