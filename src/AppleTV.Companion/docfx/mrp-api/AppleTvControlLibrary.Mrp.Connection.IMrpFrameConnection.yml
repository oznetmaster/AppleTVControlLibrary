  assemblies:
  - AppleTvControlLibrary.Mrp
  namespace: AppleTvControlLibrary.Mrp.Connection
  summary: >-
    Abstraction over the piece of MrpProtocol that turns a serialized protobuf

    payload into whatever bytes actually need to be transmitted, and vice versa. This is what

    lets MrpProtocol be driven by an AirPlay-tunneled connection (HAP-channel

    framing/encryption) or, historically, a raw-TCP connection.
  remarks: >-
    Mirrors pyatv's <code>AbstractMrpConnection</code> (pyatv/protocols/mrp/connection.py — line 16-37

    as of pyatv 0.18.0), trimmed to the members MrpProtocol actually depends on;

    pyatv's <code>connect</code>/<code>connected</code>/<code>close</code> are transport-lifecycle concerns owned

    by the transport classes in this port, not by this interface.
  example: []
  syntax:
    content: public interface IMrpFrameConnection
    content.vb: Public Interface IMrpFrameConnection
  derivedClasses:
  - AppleTvControlLibrary.Mrp.AirPlay.AirPlayMrpConnection
