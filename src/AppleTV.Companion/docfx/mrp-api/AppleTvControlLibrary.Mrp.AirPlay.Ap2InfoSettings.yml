  assemblies:
  - AppleTvControlLibrary.Mrp
  namespace: AppleTvControlLibrary.Mrp.AirPlay
  summary: Client identity fields reported to the receiver during AirPlay 2 session setup.
  remarks: >-
    A minimal analogue of pyatv's <code>InfoSettings</code> (pydantic model) exposing only the fields

    <xref href="AppleTvControlLibrary.Mrp.AirPlay.Ap2Session" data-throw-if-not-resolved="false"></xref> needs. pyatv/settings.py — line 41-44 as of pyatv 0.18.0 gives the

    library's own default values (a generic iPhone identity); this port keeps the same defaults

    so a fresh setup behaves identically to pyatv out of the box.
