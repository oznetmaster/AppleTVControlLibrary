- uid: AppleTvControlLibrary.Mrp.Protocol.MrpProtocol.RawMessageReceived
  commentId: E:AppleTvControlLibrary.Mrp.Protocol.MrpProtocol.RawMessageReceived
  id: RawMessageReceived
  parent: AppleTvControlLibrary.Mrp.Protocol.MrpProtocol
  langs:
  - csharp
  - vb
  name: RawMessageReceived
  nameWithType: MrpProtocol.RawMessageReceived
  fullName: AppleTvControlLibrary.Mrp.Protocol.MrpProtocol.RawMessageReceived
  type: Event
  source:
    remote:
      path: src/AppleTv.Mrp/Protocol/MrpProtocol.cs
      branch: master
      repo: https://github.com/oznetmaster/AppleTVControlLibrary.git
    id: RawMessageReceived
    path: ../../AppleTv.Mrp/Protocol/MrpProtocol.cs
    startLine: 249
  assemblies:
  - AppleTvControlLibrary.Mrp
  namespace: AppleTvControlLibrary.Mrp.Protocol
  summary: >-
    Raised for every inbound message, before correlation/dispatch, carrying the raw message

    type number and full serialized payload.
  remarks: >-
    This is a diagnostic-only hook, not a port of anything in pyatv. Its purpose is to make

    message types absent from the vendored pyatv 0.18.0 <code>.proto</code> set observable instead of

    silently dropped: <code>ProtocolMessage.Type</code> declares <code>SET_READY_STATE_MESSAGE = 36</code>

    and <code>UPDATE_ACTIVE_SYSTEM_ENDPOINT_MESSAGE = 77</code> with no corresponding extension

    message/field anywhere in the tree, and the enum itself skips 13, 14 and 45 entirely, so

    pyatv has no name — and therefore no handler — for whatever Apple sends under those numbers.

    <xref href="AppleTvControlLibrary.Mrp.Protocol.MrpProtocol.Listener" data-throw-if-not-resolved="false"></xref>/<xref href="AppleTvControlLibrary.Mrp.Protocol.IMrpProtocolListener" data-throw-if-not-resolved="false"></xref> only ever surfaces

    <xref href="AppleTvControlLibrary.Mrp.Protobuf.ProtocolMessage" data-throw-if-not-resolved="false"></xref> instances decoded against <xref href="AppleTvControlLibrary.Mrp.Protocol.MrpExtensions.Registry" data-throw-if-not-resolved="false"></xref>,

    which is sufficient for known extension fields but does not by itself make an unnamed type

    number easy to spot; this event exists purely so a consumer can log every

    <code>(type, raw bytes)</code> pair unconditionally while investigating unknown wire traffic.
  example: []
  syntax:
    content: public event Action<int, byte[]>? RawMessageReceived
    return:
      type: System.Action{System.Int32,System.Byte[]}
    content.vb: Public Event RawMessageReceived As Action(Of Integer, Byte())
