    path: ../../AppleTv.Mrp/Protocol/MrpProtocol.cs
    startLine: 124
  assemblies:
  - AppleTvControlLibrary.Mrp
  namespace: AppleTvControlLibrary.Mrp.Protocol
  summary: >-
    Protocol logic related to MRP: connects, performs the initial DEVICE_INFORMATION exchange,

    enables encryption via pair-verify, sends the post-encryption bootstrap messages, and

    provides request/response correlation plus unsolicited-message dispatch on top of

    MrpConnection.
  remarks: >-
    This type has no socket I/O of its own; a caller supplies <xref href="AppleTvControlLibrary.Mrp.Protocol.MrpProtocol.AsyncSender" data-throw-if-not-resolved="false"></xref> to

    transmit framed bytes and feeds inbound bytes to the underlying MrpConnection

    (via <xref href="AppleTvControlLibrary.Mrp.Protocol.MrpProtocol.Connection" data-throw-if-not-resolved="false"></xref>), mirroring the transport-agnostic design already used by

    AppleTv.Companion's <code>CompanionProtocol</code>.
  example: []
  syntax:
    content: 'public sealed class MrpProtocol : IMrpConnectionListener, IDisposable'
    content.vb: Public NotInheritable Class MrpProtocol Implements IMrpConnectionListener, IDisposable
