  assemblies:
  - AppleTvControlLibrary.Mrp
  namespace: AppleTvControlLibrary.Mrp.PlayerState
  summary: >-
    Forwards <xref href="AppleTvControlLibrary.Mrp.PlayerState.MrpPlayerStateManager" data-throw-if-not-resolved="false"></xref> updates for the active client/player to a

    registered <xref href="AppleTvControlLibrary.Mrp.PlayerState.IMrpPushUpdaterListener" data-throw-if-not-resolved="false"></xref>, mirroring pyatv's <code>MrpPushUpdater</code>.
  remarks: >-
    Unlike pyatv, which installs itself as <code>PlayerStateManager.listener</code> and receives a

    no-argument callback (reading <code>self.psm.playing</code> itself), this type both installs itself

    as <xref href="AppleTvControlLibrary.Mrp.PlayerState.IMrpPlayerStateListener" data-throw-if-not-resolved="false"></xref> and does the "read playing" step, since that is exactly

    what pyatv's <code>state_updated()</code> does synchronously before dispatch.
  example: []
  syntax:
    content: 'public sealed class MrpPushUpdater : IMrpPlayerStateListener'
    content.vb: Public NotInheritable Class MrpPushUpdater Implements IMrpPlayerStateListener
