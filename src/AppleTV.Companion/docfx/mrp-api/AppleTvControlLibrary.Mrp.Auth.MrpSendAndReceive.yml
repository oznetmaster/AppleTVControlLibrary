- uid: AppleTvControlLibrary.Mrp.Auth.MrpSendAndReceive
  commentId: T:AppleTvControlLibrary.Mrp.Auth.MrpSendAndReceive
  id: MrpSendAndReceive
  parent: AppleTvControlLibrary.Mrp.Auth
  children: []
  langs:
  - csharp
  - vb
  name: MrpSendAndReceive
  nameWithType: MrpSendAndReceive
  fullName: AppleTvControlLibrary.Mrp.Auth.MrpSendAndReceive
  type: Delegate
  source:
    remote:
      path: src/AppleTv.Mrp/Auth/MrpAuth.cs
      branch: master
      repo: https://github.com/oznetmaster/AppleTVControlLibrary.git
    id: MrpSendAndReceive
    path: ../../AppleTv.Mrp/Auth/MrpAuth.cs
    startLine: 24
  assemblies:
  - AppleTvControlLibrary.Mrp
  namespace: AppleTvControlLibrary.Mrp.Auth
  summary: Sends a CRYPTO_PAIRING_MESSAGE and returns the corresponding response message.
  remarks: >-
    pyatv correlates pairing exchanges through <code>protocol.send_and_receive(msg, generate_identifier=False)</code>

    (pyatv/protocols/mrp/auth.py — lines 41, 58, 73, 82, 103, 116 as of pyatv 0.18.0); the caller of

    <xref href="AppleTvControlLibrary.Mrp.Auth.MrpPairSetupProcedure" data-throw-if-not-resolved="false"></xref>/<xref href="AppleTvControlLibrary.Mrp.Auth.MrpPairVerifyProcedure" data-throw-if-not-resolved="false"></xref> is expected to provide an

    equivalent request/response correlation over the underlying <code>MrpConnection</code>/<code>MrpProtocol</code>.
  example: []
  syntax:
    content: public delegate Task<ProtocolMessage> MrpSendAndReceive(ProtocolMessage message)
    parameters:
    - id: message
      type: AppleTvControlLibrary.Mrp.Protobuf.ProtocolMessage
      description: The message to send.
    return:
      type: System.Threading.Tasks.Task{AppleTvControlLibrary.Mrp.Protobuf.ProtocolMessage}
      description: The response message received from the device.
    content.vb: Public Delegate Function MrpSendAndReceive(message As ProtocolMessage) As Task(Of ProtocolMessage)
