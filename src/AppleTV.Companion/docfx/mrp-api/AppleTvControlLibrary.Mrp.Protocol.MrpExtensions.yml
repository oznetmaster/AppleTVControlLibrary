  namespace: AppleTvControlLibrary.Mrp.Protocol
  summary: >-
    A shared <xref href="Google.Protobuf.ExtensionRegistry" data-throw-if-not-resolved="false"></xref> covering every <code>ProtocolMessage</code> extension field

    generated from the vendored pyatv <code>.proto</code> files, so a <xref href="AppleTvControlLibrary.Mrp.Protobuf.ProtocolMessage" data-throw-if-not-resolved="false"></xref> can be

    parsed from the wire without silently dropping its typed payload.
  remarks: >-
    The Companion Link protobuf equivalent does not exist because Companion uses OPACK, not

    protobuf; MRP messages, however, are protobuf extension fields on <code>ProtocolMessage</code>

    (see e.g. <code>CryptoPairingMessage.proto</code>: <code>extend ProtocolMessage { optional

    CryptoPairingMessage cryptoPairingMessage = 39; }</code>), and Google.Protobuf only decodes

    extension fields that are registered up front via an <xref href="Google.Protobuf.ExtensionRegistry" data-throw-if-not-resolved="false"></xref> passed to

    the parser.
  example: []
  syntax:
    content: public static class MrpExtensions
    content.vb: Public Module MrpExtensions
