  type: Method
  source:
    remote:
      path: src/AppleTv.Mrp/RemoteControl/MrpRemoteControl.cs
      branch: master
      repo: https://github.com/oznetmaster/AppleTVControlLibrary.git
    id: GetArtworkAsync
    path: ../../AppleTv.Mrp/RemoteControl/MrpRemoteControl.cs
    startLine: 405
  assemblies:
  - AppleTvControlLibrary.Mrp
  namespace: AppleTvControlLibrary.Mrp.RemoteControl
  summary: >-
    Fetches artwork for the currently playing item, mirroring pyatv's <code>MrpMetadata.artwork()</code>:

    checks a small identifier-keyed cache first, then attempts a remote (HTTP) fetch using

    <code>artworkIdentifier</code>/<code>artworkURL</code> metadata, and falls back to an in-band MRP fetch

    (<xref href="AppleTvControlLibrary.Mrp.RemoteControl.MrpRemoteControl.GetLocalArtworkAsync(System.Int32%2cSystem.Int32%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>) if the remote fetch does not produce a result. All

    fetch failures (HTTP errors, malformed URL templates, cancelled/failed MRP round-trips) are

    valid outcomes — not every item has artwork, and a device may reject the request — so they

    are handled by returning <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> rather than propagating.
  example: []
  syntax:
    content: public Task<(byte[] Data, string? MimeType)?> GetArtworkAsync(int width = -1, int height = 400, CancellationToken cancellationToken = default)
    parameters:
    - id: width
      type: System.Int32
      description: The requested artwork width, or -1 for no preference.
    - id: height
      type: System.Int32
      description: The requested artwork height, or -1 for no preference.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: A token that cancels the operation.
    return:
      type: System.Threading.Tasks.Task{System.Nullable{System.ValueTuple{System.Byte[],System.String}}}
      description: The artwork bytes and MIME type, or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> if no artwork is available.
    content.vb: Public Function GetArtworkAsync(width As Integer = -1, height As Integer = 400, cancellationToken As CancellationToken = Nothing) As Task(Of (Data As Byte(), MimeType As String)?)
  overload: AppleTvControlLibrary.Mrp.RemoteControl.MrpRemoteControl.GetArtworkAsync*
  nameWithType.vb: MrpRemoteControl.GetArtworkAsync(Integer, Integer, CancellationToken)
  fullName.vb: AppleTvControlLibrary.Mrp.RemoteControl.MrpRemoteControl.GetArtworkAsync(Integer, Integer, System.Threading.CancellationToken)
  name.vb: GetArtworkAsync(Integer, Integer, CancellationToken)
