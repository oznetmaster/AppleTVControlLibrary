  assemblies:
  - AppleTvControlLibrary.Mrp
  namespace: AppleTvControlLibrary.Mrp.AirPlay
  summary: Start sending periodic RTSP <code>/feedback</code> keep-alive requests on the control connection.
  remarks: >-
    Without this, the Apple TV closes the control (and therefore data-stream) connection a few

    seconds after RECORD completes. Must be called once <xref href="AppleTvControlLibrary.Mrp.AirPlay.Ap2Session.SetupRemoteControlAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>

    has completed.
  example: []
