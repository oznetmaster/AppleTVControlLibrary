  namespace: AppleTvControlLibrary.Mrp.Auth
  summary: Perform MRP pairing and return new credentials.
  remarks: >-
    MRP pair-setup is a thin wrapper around the shared HAP SRP routines in <xref href="AppleTvControlLibrary.Auth.SrpAuthHandler" data-throw-if-not-resolved="false"></xref>;

    only the message shapes (CRYPTO_PAIRING_MESSAGE with a TLV8 <code>pairingData</code> field) differ from

    Companion Link.
