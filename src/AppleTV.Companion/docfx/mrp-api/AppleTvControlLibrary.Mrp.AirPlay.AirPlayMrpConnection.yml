    path: ../../AppleTv.Mrp/AirPlay/AirPlayMrpConnection.cs
    startLine: 57
  assemblies:
  - AppleTvControlLibrary.Mrp
  namespace: AppleTvControlLibrary.Mrp.AirPlay
  summary: Gets or sets an asynchronous callback for transmitting a fully-built frame.
  remarks: >-
    Set by <xref href="AppleTvControlLibrary.Mrp.Protocol.MrpProtocol.AsyncSender" data-throw-if-not-resolved="false"></xref>; this adapter re-parses the frame

    (produced by <xref href="AppleTvControlLibrary.Mrp.AirPlay.AirPlayMrpConnection.BuildMessage(System.Byte%5b%5d)" data-throw-if-not-resolved="false"></xref> as a byte-identity passthrough) back into a

    <xref href="AppleTvControlLibrary.Mrp.Protobuf.ProtocolMessage" data-throw-if-not-resolved="false"></xref> so it can be handed to <xref href="AppleTvControlLibrary.Mrp.AirPlay.Channels.DataStreamChannel.SendProtobuf(AppleTvControlLibrary.Mrp.Protobuf.ProtocolMessage)" data-throw-if-not-resolved="false"></xref>,

    which does its own AirPlay-specific framing rather than the variant-length framing used by

    direct TCP MRP.
  example: []
  syntax:
    content: public Task SendAsync(byte[] frame)
    parameters:
    - id: frame
      type: System.Byte[]
    return:
      type: System.Threading.Tasks.Task
    content.vb: Public Function SendAsync(frame As Byte()) As Task
