  assemblies:
  - AppleTvControlLibrary.Mrp
  namespace: AppleTvControlLibrary.Mrp.AirPlay
  summary: Build a message ready to send from a serialized protobuf payload.
  remarks: >-
    The AirPlay data channel does its own framing (see <xref href="AppleTvControlLibrary.Mrp.AirPlay.Channels.DataStreamChannel.SendProtobuf(AppleTvControlLibrary.Mrp.Protobuf.ProtocolMessage)" data-throw-if-not-resolved="false"></xref>),

    so this is an identity passthrough rather than the variant-length prefixing used by direct TCP

    MRP; the actual send happens in <xref href="AppleTvControlLibrary.Mrp.AirPlay.AirPlayMrpConnection.SendAsync(System.Byte%5b%5d)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public byte[] BuildMessage(byte[] data)
    parameters:
    - id: data
      type: System.Byte[]
      description: The serialized protobuf message payload.
    return:
      type: System.Byte[]
      description: The bytes to write to the transport.
    content.vb: Public Function BuildMessage(data As Byte()) As Byte()
