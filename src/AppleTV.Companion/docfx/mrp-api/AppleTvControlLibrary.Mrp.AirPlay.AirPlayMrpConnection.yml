  assemblies:
  - AppleTvControlLibrary.Mrp
  namespace: AppleTvControlLibrary.Mrp.AirPlay
  summary: >-
    MRP connection implemented as a channel/stream tunneled over an AirPlay 2 data-stream

    channel, rather than a raw TCP socket. This is the adapter that lets <xref href="AppleTvControlLibrary.Mrp.Protocol.MrpProtocol" data-throw-if-not-resolved="false"></xref>

    be driven by an already-established <xref href="AppleTvControlLibrary.Mrp.AirPlay.Ap2Session" data-throw-if-not-resolved="false"></xref> instead of Transport.TcpMrpTransport.
  example: []
  syntax:
    content: 'public sealed class AirPlayMrpConnection : IMrpFrameConnection, IDataStreamListener, IDisposable'
