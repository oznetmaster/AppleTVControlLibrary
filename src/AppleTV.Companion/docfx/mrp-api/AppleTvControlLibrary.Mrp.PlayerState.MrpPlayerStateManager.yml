  assemblies:
  - AppleTvControlLibrary.Mrp
  namespace: AppleTvControlLibrary.Mrp.PlayerState
  summary: >-
    Manages state of all media players, dispatching MRP state-update messages onto

    <xref href="AppleTvControlLibrary.Mrp.PlayerState.MrpClient" data-throw-if-not-resolved="false"></xref>/<xref href="AppleTvControlLibrary.Mrp.PlayerState.MrpPlayerState" data-throw-if-not-resolved="false"></xref> instances and notifying a listener

    whenever state relevant to the active client/player changes.
  remarks: >-
    Implements <xref href="AppleTvControlLibrary.Mrp.Protocol.IMrpProtocolListener" data-throw-if-not-resolved="false"></xref> directly and should be assigned to

    <xref href="AppleTvControlLibrary.Mrp.Protocol.MrpProtocol.Listener" data-throw-if-not-resolved="false"></xref> (or chained via a multiplexing listener), since

    <xref href="AppleTvControlLibrary.Mrp.Protocol.MrpProtocol" data-throw-if-not-resolved="false"></xref> — unlike pyatv's <code>MessageDispatcher</code> — exposes a single

    unsolicited-message sink rather than per-type registration.
  example: []
  syntax:
    content: 'public sealed class MrpPlayerStateManager : IMrpProtocolListener'
    content.vb: Public NotInheritable Class MrpPlayerStateManager Implements IMrpProtocolListener
