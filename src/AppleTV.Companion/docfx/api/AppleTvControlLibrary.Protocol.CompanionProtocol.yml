  source:
    id: CompanionProtocol
    path: C:\Projects\AppleTVControlLibrary\src\AppleTV.Companion\Protocol\CompanionProtocol.cs
    startLine: 123
  assemblies:
  - AppleTvControlLibrary
  namespace: AppleTvControlLibrary.Protocol
  summary: >-
    Protocol logic related to Companion: frame dispatch, XID/frame-type based response

    correlation, and OPACK-level send/receive plumbing built on top of <xref href="AppleTvControlLibrary.Connection.CompanionConnection" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    Unlike pyatv, which relies on asyncio futures (<code>SharedData</code>) to await a response, this

    port uses synchronous callback-based correlation: sending a frame is expected to synchronously

    (or, for a real transport, eventually) result in <code>CompanionConnection.FrameReceived</code> being

    invoked with the matching response, at which point the originally registered continuation is

    invoked. This

    keeps the type usable both by an in-memory test harness (as used for WP5/WP6 validation) and by

    a future asynchronous socket transport without changing the correlation logic itself.
  example: []
  syntax:
    content: public sealed class CompanionProtocol
    content.vb: Public NotInheritable Class CompanionProtocol
