- uid: AppleTvControlLibrary.Protocol.CompanionProtocol.ResponseTimeout
  commentId: P:AppleTvControlLibrary.Protocol.CompanionProtocol.ResponseTimeout
  id: ResponseTimeout
  parent: AppleTvControlLibrary.Protocol.CompanionProtocol
  langs:
  - csharp
  - vb
  name: ResponseTimeout
  nameWithType: CompanionProtocol.ResponseTimeout
  fullName: AppleTvControlLibrary.Protocol.CompanionProtocol.ResponseTimeout
  type: Property
  source:
    id: ResponseTimeout
    path: C:\Projects\AppleTVControlLibrary\src\AppleTV.Companion\Protocol\CompanionProtocol.cs
    startLine: 220
  assemblies:
  - AppleTvControlLibrary
  namespace: AppleTvControlLibrary.Protocol
  summary: >-
    Gets or sets how long to wait for a response before <xref href="AppleTvControlLibrary.Protocol.CompanionProtocol.ExchangeAuth(AppleTvControlLibrary.Connection.FrameType%2cSystem.Collections.Generic.Dictionary%7bSystem.String%2cSystem.Object%7d)" data-throw-if-not-resolved="false"></xref> or

    <xref href="AppleTvControlLibrary.Protocol.CompanionProtocol.ExchangeOpack(AppleTvControlLibrary.Connection.FrameType%2cSystem.Collections.Generic.Dictionary%7bSystem.String%2cSystem.Object%7d)" data-throw-if-not-resolved="false"></xref> throws a <xref href="AppleTvControlLibrary.Protocol.ProtocolException" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    Unlike the in-memory fake device used for WP5/WP6 validation (where

    <code>CompanionConnection.FrameReceived</code> fires synchronously, inline with the send

    call), a real socket transport delivers the response from a separate read thread/task,

    asynchronously with respect to the caller of <xref href="AppleTvControlLibrary.Protocol.CompanionProtocol.ExchangeAuth(AppleTvControlLibrary.Connection.FrameType%2cSystem.Collections.Generic.Dictionary%7bSystem.String%2cSystem.Object%7d)" data-throw-if-not-resolved="false"></xref>/

    <xref href="AppleTvControlLibrary.Protocol.CompanionProtocol.ExchangeOpack(AppleTvControlLibrary.Connection.FrameType%2cSystem.Collections.Generic.Dictionary%7bSystem.String%2cSystem.Object%7d)" data-throw-if-not-resolved="false"></xref>. This wait handle lets both usages share the same

    correlation logic without changing it: the fake device signals it before the wait ever

    blocks, while a real transport signals it once the background read loop processes the

    matching frame.
  example: []
  syntax:
    content: public TimeSpan ResponseTimeout { get; set; }
    parameters: []
    return:
      type: System.TimeSpan
    content.vb: Public Property ResponseTimeout As TimeSpan
  overload: AppleTvControlLibrary.Protocol.CompanionProtocol.ResponseTimeout*
