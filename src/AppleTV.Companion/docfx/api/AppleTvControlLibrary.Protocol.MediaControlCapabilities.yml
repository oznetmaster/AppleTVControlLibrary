  - AppleTvControlLibrary
  namespace: AppleTvControlLibrary.Protocol
  summary: >-
    Bitmask flags advertised by the <code>_iMC</code> event (<code>_mcF</code> field), indicating which media

    controls the currently active app on the device supports. Notably, <xref href="AppleTvControlLibrary.Protocol.MediaControlCapabilities.Volume" data-throw-if-not-resolved="false"></xref> being

    clear means the device has no Companion-addressable volume/mute control at all (audio is

    managed over HDMI-CEC instead), so callers must check this before using

    <xref href="AppleTvControlLibrary.Protocol.MediaControlCommand.GetVolume" data-throw-if-not-resolved="false"></xref>/<xref href="AppleTvControlLibrary.Protocol.MediaControlCommand.SetVolume" data-throw-if-not-resolved="false"></xref>.
  example: []
