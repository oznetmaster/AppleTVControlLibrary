  type: Class
  source:
    id: CompanionConnection
    path: C:\Projects\AppleTVControlLibrary\src\AppleTV.Companion\Connection\CompanionConnection.cs
    startLine: 76
  assemblies:
  - AppleTvControlLibrary
  namespace: AppleTvControlLibrary.Connection
  summary: >-
    Frame-level protocol handling for a Companion Link connection: header framing,

    buffering of partial frames and transparent ChaCha20-Poly1305 encryption.
  remarks: >-
    This type intentionally has no socket I/O of its own; a caller feeds inbound bytes

    via <xref href="AppleTvControlLibrary.Connection.CompanionConnection.ReceiveData(System.Byte%5b%5d)" data-throw-if-not-resolved="false"></xref> and consumes outbound bytes via <xref href="AppleTvControlLibrary.Connection.CompanionConnection.BuildFrame(AppleTvControlLibrary.Connection.FrameType%2cSystem.Byte%5b%5d)" data-throw-if-not-resolved="false"></xref>,

    so it can be driven by any transport (Socket, SslStream over sockets not applicable

    here, etc.) on either target framework.
  example: []
  syntax:
    content: public class CompanionConnection
    content.vb: Public Class CompanionConnection
