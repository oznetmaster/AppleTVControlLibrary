  summary: Get properties from an NSKeyedArchiver encoded binary plist.
  example: []
  syntax:
    content: public static object?[] ReadArchiveProperties(byte[] archive, params string[][] paths)
    parameters:
    - id: archive
      type: System.Byte[]
      description: The raw NSKeyedArchiver encoded binary plist bytes.
    - id: paths
      type: System.String[][]
      description: One or more key paths to follow from <code>$top</code>, dereferencing UID values into <code>$objects</code> along the way.
    return:
      type: System.Object[]
      description: >-
        One resolved value per requested path, in the same order, or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> for a

        path that could not be fully resolved.
