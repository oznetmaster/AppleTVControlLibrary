syntax = "proto2";
option csharp_namespace = "AppleTvControlLibrary.Mrp.Protobuf";

import "pyatv/protocols/mrp/protobuf/ProtocolMessage.proto";
import "pyatv/protocols/mrp/protobuf/VirtualTouchDeviceDescriptorMessage.proto";

extend ProtocolMessage {
  optional RegisterHIDDeviceMessage registerHIDDeviceMessage = 11;
}

message RegisterHIDDeviceMessage {
  optional VirtualTouchDeviceDescriptor deviceDescriptor = 1;
}